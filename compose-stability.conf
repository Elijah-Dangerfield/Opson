// Classes the Compose compiler should treat as stable though it can't prove it,
// read by every module that applies opson.compose.multiplatform or opson.application
// (ComposeStability.kt in build-logic). Each pattern names one package level:
// `*` does not reach subpackages, so diary.db's Room entities stay out.
//
// Read-only collections and kotlinx.datetime values are never mutated through
// the types we pass. The diary and nutrition domain types are immutable data
// classes and enums by rule (docs/review/PRACTICES.md, section 2), so a screen
// that takes one skips when it is equal. Add a package here only if that holds
// for every class in it.
kotlin.collections.*
kotlinx.datetime.*
com.opson.libraries.nutrition.*
com.opson.libraries.diary.*
