# ─────────────────────────────────────────────────────────────────────────────
# Monthly refresh of the USDA Branded Foods part of the food catalog.
#
# Downloads the newest Branded Foods CSV release listed on the FoodData
# Central download page and upserts it into `foods` through psql, in one
# transaction, keyed on barcode: products already there are refreshed in
# place (same food id, popularity kept), new ones are added, and nothing is
# deleted. USDA publishes a release about twice a year, so most months this
# rewrites the same rows and changes nothing anyone can see.
#
# Fires on:    the 3rd of every month, and workflow_dispatch.
# Needs:       CATALOG_DATABASE_URL, a postgresql:// URL for the database to
#              load (for Supabase, the session pooler on port 5432). Without it
#              the job skips with a notice. The server must already have run
#              its migrations there (V10); the importer checks and stops if not.
# Writes:      only the `foods` table. Counts and sizes go to the job summary.
#
# See apps/server/README.md (Food catalog) for running the same import by hand.
# ─────────────────────────────────────────────────────────────────────────────

name: Food catalog refresh

on:
  schedule:
    - cron: '23 7 3 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: food-catalog-refresh
  cancel-in-progress: false

jobs:
  branded-foods:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check for the database secret
        id: secret
        env:
          CATALOG_DATABASE_URL: ${{ secrets.CATALOG_DATABASE_URL }}
        run: |
          if [ -z "$CATALOG_DATABASE_URL" ]; then
            echo "::notice title=Food catalog refresh skipped::CATALOG_DATABASE_URL is not set, so there is no database to load. Add it under Settings, Secrets and variables, Actions to turn the monthly refresh on."
            {
              echo "### Food catalog refresh skipped"
              echo ""
              echo "The \`CATALOG_DATABASE_URL\` secret is not set, so nothing was imported."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secret.outputs.configured == 'true'

      - name: Install psql
        if: steps.secret.outputs.configured == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql --version

      - name: Import USDA Branded Foods
        if: steps.secret.outputs.configured == 'true'
        env:
          # Read by the importer from the environment, so the URL is never on
          # a command line.
          CATALOG_DATABASE_URL: ${{ secrets.CATALOG_DATABASE_URL }}
        run: python3 -I scripts/import_usda_foods.py --branded --psql --summary "$GITHUB_STEP_SUMMARY"
