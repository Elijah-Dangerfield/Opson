# ─────────────────────────────────────────────────────────────────────────────
# Server deploy to Fly.io.
#
# Fires on:    push to main, only when something server-affecting changes.
#              Also workflow_dispatch for a manual redeploy, with a `dry_run`
#              input that builds the image (`fly deploy --build-only`) without
#              shipping it — the cheap way to validate the Docker build.
# Side effects: deploys opson-server-dev. (opson-server-prod
#              deploys via server-deploy-prod.yml, gated on a human approval.)
# Auth:        FLY_API_TOKEN_DEV secret, created via
#                `fly tokens create deploy -a opson-server-dev --expiry 8760h`
#              and pasted into Repo Settings → Secrets and variables → Actions.
#
# See apps/server/DEPLOY.md for the one-time setup walkthrough.
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy server (dev)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/server/**'
      # The hosted admin console ships inside the server image, so console
      # changes redeploy the server too.
      - 'apps/admin/**'
      - 'build-logic/**'
      - 'gradle/libs.versions.toml'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/server-deploy.yml'
      - 'scripts/seed_dev_config.py'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build the image only (fly deploy --build-only) — no deploy, no smoke test.'
        required: false
        default: false
        type: boolean

concurrency:
  # If multiple deploys queue up, run the latest only.
  group: server-deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Fly (dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Belt-and-suspenders: even if someone pushes a broken server past
      # CI (force-push, branch-protection bypass, label-skipped checks),
      # we run the suite here and refuse to deploy on failure. Postgres
      # comes up via testcontainers, so Docker on the runner is required.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Run server tests
        run: ./gradlew :apps:server:test

      # Build the admin console bundle on this runner and stage it where the
      # Dockerfile's runtime COPY picks it up. Deliberately NOT part of the
      # in-container Gradle build — that build runs serverOnly on a tight
      # memory budget and must not grow a Node/webpack toolchain.
      - name: Build admin console bundle
        run: |
          ./gradlew :apps:admin:jsBrowserDistribution
          cp -R apps/admin/build/dist/js/productionExecutable/. apps/server/admin-web/
          ls apps/server/admin-web/

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      - name: Deploy
        # --local-only: build the image on this runner (16GB, isolated) instead
        # of Fly's shared remote builder — dev + prod deploying together on one
        # builder can OOM-kill both Gradle builds. On dry_run, --build-only
        # builds the image and stops: no machines are touched.
        run: |
          flyctl deploy \
            --config apps/server/fly.toml \
            --local-only \
            ${{ inputs.dry_run && '--build-only' || '' }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_DEV }}

      - name: Smoke test
        if: ${{ !inputs.dry_run }}
        # Retried, not slept on: Fly's edge can take a few seconds to route to
        # the new machine, and one early 502 is not a failed deploy.
        run: |
          curl --fail --silent --show-error \
               --retry 6 --retry-delay 5 --retry-all-errors \
               --max-time 20 \
               https://opson-server-dev.fly.dev/_health
          echo

      # Record this build's in-code config defaults so the admin tool can answer
      # "what did version X ship with". Runs after deploy so the manifest table
      # exists; re-uploading the same version is idempotent (upsert).
      #
      # A missing ADMIN_API_TOKEN_DEV fails the run (after the deploy, which
      # has already happened): the next step is what keeps dev's flags in step
      # with the app, and a warning here went unread for every dev deploy.
      # The secret must equal the ADMIN_API_TOKEN Fly secret on
      # opson-server-dev, which is also what mounts the admin routes.
      - name: Upload config manifest
        if: ${{ !inputs.dry_run }}
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_API_TOKEN_DEV }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "::error::ADMIN_API_TOKEN_DEV is not set, so dev gets no manifest and no new release flags. Set it, and ADMIN_API_TOKEN on opson-server-dev, to the same value: ./scripts/setup_fly.main.kts sets both."
            exit 1
          fi
          ./gradlew :apps:admin:exportConfigManifest
          status=$(curl --silent --show-error --max-time 30 \
            -o /tmp/manifest-response.json -w "%{http_code}" \
            -X PUT https://opson-server-dev.fly.dev/v1/admin/config/manifest \
            -H "X-Admin-Token: $ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            --data @apps/admin/build/config-manifest.json)
          echo "Manifest upload → HTTP $status"
          cat /tmp/manifest-response.json; echo
          if [ "$status" != "200" ]; then
            # The manifest is a secondary record, so a failed upload only warns.
            # Most likely the GH secret and the server's ADMIN_API_TOKEN don't
            # match; then the next step fails the run on the same 401, because
            # dev's flags matter more. Rotate both with setup_fly.main.kts.
            echo "::warning::Config manifest upload failed (HTTP $status) — server deploy still succeeded."
          fi

      # Dev runs every release flag on, so a feature merged behind a flag is
      # testable on dev the moment it lands. Only flags dev has no row for
      # are written; one set false on purpose stays false. The registry is
      # under apps/admin/**, which triggers this workflow.
      - name: Turn on new release flags on dev
        if: ${{ !inputs.dry_run }}
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_API_TOKEN_DEV }}
        run: python3 -I scripts/seed_dev_config.py https://opson-server-dev.fly.dev
