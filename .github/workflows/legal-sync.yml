# ─────────────────────────────────────────────────────────────────────────────
# Publishes this repo's legal/ Markdown to the studio website by opening a pull
# request against that site's repository.
#
# Fires on:     Pushes to main that touch legal/** or this workflow. Also
#               workflow_dispatch, to re-open the PR after closing one.
# Side effects: Publishes to the live site. It opens a pull request on
#               SITE_REPO rather than pushing, but the Nightjar site repo's
#               auto-merge-legal.yml merges any legal-sync/* branch once the
#               site builds, so treat a push to legal/** as going straight out.
# Needs:        NIGHTJAR_SITE_TOKEN — a fine-grained PAT scoped to the website
#               repository with Contents and Pull requests set to read/write.
#               `scripts/setup_legal_sync.sh` sets it.
# Edit to change: legal/privacy.md, legal/terms.md. See legal/README.md for why
#               those files live here rather than in the website repo.
#
# The published pages are:
#   https://nightjarlabs.llc/opson/privacy
#   https://nightjarlabs.llc/opson/terms
# Both get filed with Apple and Google, and both are the compiled defaults in
# LaunchGateConfigValues.kt. The slug below is what makes them those URLs.
#
# A pull request rather than a push, but on the Nightjar site nobody merges it
# by hand: that repo merges any legal-sync/* branch once its Preview build
# passes. The build is the only gate, so a file that fails the frontmatter
# schema leaves the PR open and the live site serving the last good version.
#
# The review step this used to have was dropped deliberately. A PR nobody
# remembers to merge means the published policy drifts behind the app, and that
# policy is the URL filed with Apple and Google. Stale is the worse failure.
#
# Pointing SITE_REPO at a different site? That repo needs its own auto-merge or
# these pull requests will sit there, which is the failure this paragraph is
# about. The Nightjar one is 40 lines; copy it.
#
# Shipping under a different studio? Change SITE_REPO and the domain in
# legal/README.md and LaunchGateConfigValues.kt. The website side is an Astro
# content collection at src/content/legal/<slug>/; see that repo's
# docs/legal-sync.md.
# ─────────────────────────────────────────────────────────────────────────────

name: Legal Sync

on:
  push:
    branches: [main]
    paths:
      - 'legal/**'
      - '.github/workflows/legal-sync.yml'
  workflow_dispatch:

env:
  # The directory name under the site's src/content/legal/, and therefore the
  # first path segment of the published URL. Once a store listing is live this
  # is not a cosmetic string.
  APP_SLUG: 'opson'
  APP_DISPLAY_NAME: 'Opson'
  SITE_REPO: Elijah-Dangerfield/nightjar

concurrency:
  group: legal-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4
        with:
          path: app

      - name: Check out the website
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SITE_REPO }}
          token: ${{ secrets.NIGHTJAR_SITE_TOKEN }}
          path: site

      # Fail loudly rather than opening an empty PR. A rename in legal/ that
      # nobody updated here would otherwise look like "no changes to sync".
      - name: Verify the source files exist
        run: |
          for f in privacy.md terms.md; do
            if [ ! -f "app/legal/$f" ]; then
              echo "::error::app/legal/$f is missing. Legal Sync expects legal/privacy.md and legal/terms.md." >&2
              exit 1
            fi
          done

      - name: Copy into the site
        run: |
          dest="site/src/content/legal/${APP_SLUG}"
          mkdir -p "$dest"
          cp app/legal/privacy.md app/legal/terms.md "$dest/"

      - name: Open a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          path: site
          token: ${{ secrets.NIGHTJAR_SITE_TOKEN }}
          # One long-lived branch per app, so a second push updates the open PR
          # instead of stacking a new one behind it.
          branch: legal-sync/${{ env.APP_SLUG }}
          delete-branch: true
          commit-message: |
            chore(legal): sync ${{ env.APP_DISPLAY_NAME }} privacy and terms

            Generated from ${{ github.repository }}@${{ github.sha }}.
          title: 'chore(legal): sync ${{ env.APP_DISPLAY_NAME }} privacy and terms'
          body: |
            Generated by [Legal Sync](${{ github.server_url }}/${{ github.repository }}/blob/main/.github/workflows/legal-sync.yml)
            from [`${{ github.repository }}`](${{ github.server_url }}/${{ github.repository }}) at
            [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}).

            **Do not edit these files here.** `legal/privacy.md` and
            `legal/terms.md` in the app repository are the source of truth; the
            next sync overwrites whatever is in this branch.

            Merging publishes to:

            - `https://nightjarlabs.llc/${{ env.APP_SLUG }}/privacy`
            - `https://nightjarlabs.llc/${{ env.APP_SLUG }}/terms`

            The Preview check on this PR posts a URL for the rendered pages.
            Read them, not just the diff: the question before publishing a
            policy is whether it still describes the app, which a diff cannot
            answer.
