# ─────────────────────────────────────────────────────────────────────────────
# Maintains the release PR. Bumps versions, writes CHANGELOG, creates tag,
# then dispatches release.yml (the default GITHUB_TOKEN doesn't cascade
# triggers on tag pushes, so we explicitly hand off).
#
# Fires on:     Push to main.
# Side effects: Opens or updates a single open PR titled "chore: release main".
#               When that PR is merged, creates the git tag `vX.Y.Z` + a
#               matching GitHub Release, then fires release.yml for that tag.
# Version rule: fix/perf → patch bump. feat → minor. feat!/BREAKING → major
#               (capped at minor while pre-1.0 per bump-minor-pre-major).
#               chore/docs/ci/build/refactor/style/test/revert → no bump.
# Edit to change: release-please-config.json (which files are bumped, bump
#                 rules), .release-please-manifest.json (current version).
# See: docs/release-automation.md → "Cutting a release"
# ─────────────────────────────────────────────────────────────────────────────

name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect first release (no prior v* tag)
        id: first_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # No v* tag means release.yml has never shipped from this repo. That
          # is not the same as the stores having nothing: 0.1.0 and the first
          # 0.2 TestFlight build went up from a laptop. release.yml asks each
          # store and goes to production wherever a release already exists, so
          # the banner says that rather than promising an internal-only run.
          TAG_COUNT=$(git tag -l 'v*' | wc -l | tr -d ' ')
          if [ "$TAG_COUNT" = "0" ]; then
            echo "is_first_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_first_release=false" >> "$GITHUB_OUTPUT"
          fi

      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Prepend first-release banner to release-please PR
        if: steps.first_release.outputs.is_first_release == 'true' && steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass the raw JSON and parse inside the script. Putting
          # `fromJson(...)` in env evaluates at job-prep time and fails
          # with "Error reading JToken from JsonReader" when the upstream
          # output is empty — even if the `if` guard above would skip the
          # step.
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          set -e
          PR_NUMBER=$(printf '%s' "$PR_JSON" | jq -r .number)
          CURRENT=$(gh pr view "$PR_NUMBER" --json body -q .body || echo "")
          BANNER=$(cat <<'EOF'
          > **First release from this pipeline. Check both stores before merging.**
          >
          > No `v*` tag exists yet, so release.yml has never run a real release here. It decides per store, not from tags:
          > - **Play:** production if Play already has a production release, otherwise the internal track (promote it by hand in Play Console).
          > - **App Store:** submitted for review if App Store Connect already has a build of this app, otherwise TestFlight only (submit by hand).
          >
          > Builds uploaded from a laptop count, so this can go straight to production on both. See `SETUP.md`.

          EOF
          )
          printf '%s\n%s' "$BANNER" "$CURRENT" > /tmp/body.md
          gh pr edit "$PR_NUMBER" --body-file /tmp/body.md

      - name: Dispatch release.yml for the new tag
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release.yml \
            -f tag="${{ steps.release.outputs.tag_name }}" \
            --repo "$GITHUB_REPOSITORY"
