# The prod Supabase project every release build signs in to. Debug builds use
# the dev project from local.properties (supabase.projectId / supabase.anonKey).
#
# Committed on purpose: a publishable key ships inside every store binary and
# only grants what row level security allows, so it is not a secret. Keeping
# it here means a release build can't silently pick up a dev project from
# someone's local.properties, which is what broke 0.1.0 (it signed in to dev
# and every call to the prod server came back 401).
supabase.prod.projectId=qmftnivpklhhozthpxej
supabase.prod.anonKey=sb_publishable_YmR9dv2ofeXkJRrlnrMsPg_9F4EcBNf
