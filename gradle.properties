#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
# Kotlin/Native compiler heap when it runs out-of-process. In practice the K/N
# compile runs INSIDE the Gradle daemon here, so the release-link OOM fix is
# the 10g daemon heap below (also passed explicitly in beta.yml / release.yml);
# this stays as belt-and-suspenders for out-of-process execution.
kotlin.native.jvmArgs=-Xmx5g
# Compile the LLVM phase of iOS links with -Oz (size-optimized). This is the
# single biggest lever on linkReleaseFrameworkIosArm64 time short of a faster
# machine: the LTO/module-optimization passes dominate the release link (see
# KT-78518) and -Oz makes them far cheaper, plus a smaller .ipa. Experimental
# (2.2.20+); the documented trade-off is possibly slower runtime code. If a
# TestFlight beta ever feels janky after a toolchain change, delete this line
# first and rebuild.
kotlin.native.binary.smallBinary=true

#Gradle
# 10g because the K/N release-LTO link runs INSIDE the Gradle daemon and needs
# >6g on a mature app (including local `fastlane beta` builds, where no CI
# override applies). Max, not committed: everyday builds use nowhere near it.
# CI contexts that need less override it (the server Dockerfile caps the heap
# for the Fly machine).
org.gradle.jvmargs=-Xmx10g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# iOS simulator builds run on Apple Silicon unless overridden by Xcode
compose.ios.resources.platform=iphonesimulator
compose.ios.resources.archs=arm64
xcodeTargetArchs=arm64