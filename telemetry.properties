# Client telemetry config, committed on purpose.
#
# A Sentry DSN is a write-only ingest endpoint, not a credential. It ships
# inside every binary on both stores, so anyone can read it out of a store
# build in minutes. Treating it as a secret buys nothing and costs the thing
# that matters: any design where each developer configures it locally means a
# fresh clone reports nothing, silently, because blank is a supported value
# meaning "off". That failure has already cost a downstream app a release.
#
# So the DSN lives here, in git, and a fresh clone reports with zero local
# setup. Run ./scripts/setup_sentry.main.kts to fill it in.
#
# Overrides, highest first: SENTRY_DSN in the environment (CI), then
# sentry.dsn in local.properties (a per-dev detour), then this file.
#
# sentry.org / sentry.project are not read by the build. They are here so
# re-running the setup script does not ask twice, and so CI can check that a
# release build is not about to ship dark.
sentry.dsn=
sentry.org=
sentry.project=
