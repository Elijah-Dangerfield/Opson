room = "2.8.4"
sqlite = "2.6.2"
datastore = "1.2.0"
roomGradlePlugin = "2.8.4"
sentryKmp = "0.22.0"
# Sentry's ANDROID Gradle plugin, distinct from the KMP SDK above. Used only to
# stamp a ProGuard UUID into the APK and upload the R8 mapping, with its
# auto-installation turned OFF so it cannot add a second Sentry SDK alongside
# the KMP one.
sentryAndroidGradlePlugin = "6.21.0"
supabaseKt = "3.6.0"
turbine = "1.2.1"
lifecycleProcess = "2.10.0"
# The composition test tier. `androidxComposeUiTest` must track the androidx
# Compose version that Compose Multiplatform resolves to on the Android target
# (`./gradlew :libraries:navigation:dependencies --configuration
# debugCompileClasspath | grep 'androidx.compose.ui:ui:'`). The test harness and
# the runtime it drives have to be the same generation.
androidxComposeUiTest = "1.9.4"
robolectric = "4.16.1"
# The Android framework jar Robolectric runs against, which is also the SDK its
# sandbox emulates: 35, one behind this repo's compileSdk. Named here rather than
# left to Robolectric's own Maven fetch so it lands in Gradle's dependency cache,
# which CI already caches; otherwise every CI run downloads ~200MB at test time
# and a Maven Central hiccup turns into a red build.
#
# The build number is dictated by the `robolectric` version above, not chosen.
# Bump one and the tests fail naming the exact artifact the other one wants, and
# `@Config(sdk = ...)` in the tests moves with it.
robolectricAndroidAll = "15-robolectric-13954326-i7"
# Preview screenshots (:apps:screenshots). Roborazzi renders under the
# Robolectric above in native graphics mode. ComposablePreviewScanner finds the
# previews; its `common` artifact is the one that understands the JetBrains
# `org.jetbrains.compose.ui.tooling.preview.Preview` this repo must use (see
# AGENTS.md, Known landmines). The library deprecates `common` in favour of the
# androidx annotation and drops it in 0.10.0, so do not bump past 0.9.x until
# previews can move to the androidx annotation without breaking the iOS link.
roborazzi = "1.77.0"
composablePreviewScanner = "0.9.3"

[libraries]
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "androidx-security-crypto" }
anvil-compiler = { module = "software.amazon.lastmile.kotlin.inject.anvil:compiler", version.ref = "kotlinInjectAnvil" }
atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }
configuration-annotations = { module = "co.touchlab.skie:configuration-annotations", version.ref = "configurationAnnotations" }
detekt-api = { module = "dev.detekt:detekt-api", version.ref = "detekt" }
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
kotlin-inject-compiler-ksp = { module = "me.tatarka.inject:kotlin-inject-compiler-ksp", version.ref = "kotlinInject" }
kotlin-inject-runtime-kmp = { module = "me.tatarka.inject:kotlin-inject-runtime-kmp", version.ref = "kotlinInject" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidx-core-splashscreen" }
# AndroidX JankStats — per-frame timing with a "missed its deadline" flag,
# aggregated per screen visit by :libraries:telemetry:impl. Android only; iOS
# has no equivalent API and reports no jank on purpose.
androidx-metrics-performance = { module = "androidx.metrics:metrics-performance", version.ref = "androidx-metricsPerformance" }
androidx-testExt-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-testExt" }
# Baseline Profile generation + the minified-release smoke test (:apps:baselineprofile).
androidx-benchmark-macroJunit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "androidx-benchmark" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidx-uiautomator" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
# The composition test tier: a real composition driven on the host JVM under
# Robolectric, the same host-JVM-Android path :apps:integration already uses.
# `ui-test-manifest` supplies the `ComponentActivity` the rule inflates.
# `android-all-instrumented` is Robolectric's framework jar, declared so Gradle
# resolves it instead of Robolectric fetching it at test time; see
# libraries/navigation/build.gradle.kts.
androidx-compose-uiTest-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "androidxComposeUiTest" }
androidx-compose-uiTest-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "androidxComposeUiTest" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
robolectric-androidAll = { module = "org.robolectric:android-all-instrumented", version.ref = "robolectricAndroidAll" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junitRule = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "roborazzi" }
composablePreviewScanner-common = { module = "io.github.sergio-sastre.ComposablePreviewScanner:common", version.ref = "composablePreviewScanner" }
compose-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "composeMultiplatform" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-savedstate = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-savedstate", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycleProcess" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
