auth0JwksRsa = "0.22.1"
sentryJvm = "7.18.1"
opentelemetry = "1.45.0"
opentelemetryInstrumentation = "2.11.0-alpha"
# KMP client-side OTel (io.opentelemetry.kotlin) — experimental, pinned exactly.
# Distinct from the server's JVM `opentelemetry` entries above.
opentelemetryKotlin = "0.5.0"
okio = "3.9.1"
jetbrainsNavigationCompose = "2.9.1"
kotlinInjectAnvil = "0.1.6"
