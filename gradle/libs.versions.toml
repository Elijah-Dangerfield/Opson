# Supabase JWT verification. java-jwt is what ktor-server-auth-jwt sits on; we
# use it directly to build the verifier. jwks-rsa fetches Supabase's public
# signing keys from the project JWKS endpoint (cached + rate-limited).
auth0-jwt = { module = "com.auth0:java-jwt", version.ref = "auth0Jwt" }
auth0-jwksRsa = { module = "com.auth0:jwks-rsa", version.ref = "auth0JwksRsa" }

