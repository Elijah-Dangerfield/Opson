kotlinx-serialization = "1.9.0"
kotlinxCoroutinesCore = "1.10.2"
kotlinxDatetime = "0.7.1"
ktor = "3.3.3"
wiretap = "1.0.0-RC15"
logback = "1.5.6"
exposed = "0.56.0"
postgres = "42.7.4"
hikari = "5.1.0"
