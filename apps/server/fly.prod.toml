# Fly.io configuration for the PRODUCTION server.
#
# Mirror of fly.toml (the dev server) — same Dockerfile, region, and
# always-warm machine — diverging only in the app name, VM size, and the
# Supabase project it points at (set via secrets, never in this file).
#
# Cheatsheet:
#   - Deploy:    fly deploy --config apps/server/fly.prod.toml
#   - Secrets:   fly secrets set KEY=VALUE -a opson-server-prod
#   - Live logs: fly logs -a opson-server-prod
#   - Console:   fly ssh console -a opson-server-prod
#   - Status:    fly status -a opson-server-prod
#
# Secrets (set separately, see apps/server/DEPLOY.md and the README's
# environment table):
#   - required: DATABASE_URL, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY;
#   - required for App Review: APPLE_TEAM_ID, APPLE_KEY_ID, APPLE_PRIVATE_KEY
#     (deletion revokes the Sign in with Apple token);
#   - before release.photo is on: ANTHROPIC_API_KEY;
#   - for the admin console and the site's form: ADMIN_API_TOKEN,
#     WAITLIST_ALLOWED_ORIGINS;
#   - to see errors and traces anywhere but `fly logs`: SENTRY_DSN,
#     OTEL_EXPORTER_OTLP_ENDPOINT, OTEL_EXPORTER_OTLP_HEADERS.
# The boot log's "Features" line says which of these are on. The `-prod`
# suffix on the app name is load-bearing: the server derives environment=prod
# from FLY_APP_NAME (see ServerConfig).
#
# Rename `app` to your own Fly app before the first deploy.

app = 'opson-server-prod'
primary_region = 'iad'   # pick the region closest to your database

[build]
  dockerfile = 'Dockerfile'

[env]
  SERVER_HOST = '0.0.0.0'
  SERVER_PORT = '8080'
  LOG_LEVEL = 'INFO'
  # Prod runs on a 1GB machine (vs dev's 512MB) for real-traffic headroom.
  # 512m heap + 96m metaspace cap leaves ~400MB for the ~150-200MB off-heap
  # floor (Netty direct buffers, thread stacks, JIT) + OS headroom. Keep
  # SerialGC for now (single small machine); revisit (G1) if pause times bite.
  JAVA_OPTS = '-Xms128m -Xmx512m -XX:MaxMetaspaceSize=96m -XX:+UseSerialGC'

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine warm 24/7 — prod must never pay the JVM cold-start tax
  # (6+s) on a user's first request. Idle machines past the first still
  # auto-stop, so we pay only for the always-warm baseline.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/_health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1024mb'
