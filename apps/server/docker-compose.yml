# Local Postgres for development. Start it with:
#   docker compose -f apps/server/docker-compose.yml up -d
# Then in apps/server/.env set:
#   DATABASE_URL=postgresql://postgres:postgres@localhost:5432/postgres
# and run: ./gradlew :apps:server:run
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - template_pgdata:/var/lib/postgresql/data
      # The tests' auth.users stub, so the migrations' foreign keys and the
      # support views (V22) resolve on plain Postgres. One file, so the local
      # database can't fall behind what the tests migrate against. It runs only
      # on a fresh volume: after a change, `docker compose ... down -v`.
      - ./src/test/resources/init-auth.sql:/docker-entrypoint-initdb.d/init-auth.sql:ro

volumes:
  template_pgdata:
