# detekt config for the project's custom ruleset.
#
# detekt's built-in rule sets are turned off in build.gradle.kts
# (disableDefaultRuleSets = true) — this file only configures the custom
# `opson` rules from :detekt-rules. Adding a rule = a new entry here plus
# a constructor reference in OpsonRuleSetProvider.
opson:
  active: true
  VerifyStrings:
    active: true
    # The config admin tool (:apps:admin) is a local-only, English-only dev
    # utility with no :libraries:resources dependency — the i18n rule doesn't
    # apply. Its `Text(...)` is Compose HTML's, not the DS composable anyway.
    excludes: ['**/apps/admin/**']
  VerifyStringArguments:
    active: true
    # As VerifyStrings, plus what no person reads: tests, preview and fixture
    # files (sample copy by convention), the leak test's surface labels (its
    # failure messages), and the server, which has no string resources.
    excludes:
      - '**/apps/admin/**'
      - '**/apps/server/**'
      - '**/src/*Test/**'
      - '**/src/test/**'
      - '**/*Previews.kt'
      - '**/*Preview.kt'
      - '**/*Fixtures.kt'
      - '**/*LeakSurfaces.kt'
  AnimatedStateReadInComposition:
    active: true
  ClassNameInTelemetryAttribute:
    active: true
  ScrollInsideBottomSheet:
    active: true
  HardcodedDisplay:
    active: true
    # :libraries:nutrition is where these values are meant to be built (its
    # :ui submodule is not, so only its own src is excluded). Test source sets
    # may build expected values to compare against.
    excludes:
      - '**/libraries/nutrition/src/**'
      - '**/src/*Test/**'
      - '**/src/test/**'
  RawBasicTextField:
    active: true
    # The design system is where the buffered field is built, so it may use the raw one.
    excludes: ['**/libraries/ui/**']
