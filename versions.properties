applicationId=com.opson
# release-please rewrites the line between these two markers on every release.
#
# The markers are NOT optional and NOT decorative: a file listed in
# `extra-files` without them is skipped **silently** — no warning, no error,
# exit 0. That is how a release downstream cut a tag and a CHANGELOG while this
# file stayed a version behind, and the binaries that reached the Play
# production track and App Store Connect were the new code labelled with the old
# version.
#
# Block form, not a trailing `# x-release-please-version` comment. In a
# properties file `#` only starts a comment at the start of a line, so a trailing
# marker becomes part of the value and you ship a versionName with a comment
# glued to it.
# x-release-please-start-version
versionName=0.1.0
# x-release-please-end
# Not release-please's to set. The release pipeline overrides it with the commit
# count at the tag (VERSION_CODE_OVERRIDE), which is the same monotonic value
# beta.yml and the iOS Fastfile use, so the stores never see it go backwards.
versionCode=1
releaseChannel=dev
buildNumber=1
